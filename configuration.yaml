
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
stt:
  - platform: wyoming
    host: 192.168.1.239
    port: 10300
    protocol: tcp

tts:
  - platform: wyoming
    host: 192.168.1.239
    port: 10301
    protocol: tcp

assist_pipeline:
  default_pipeline: local_wyoming
  pipelines:
    - name: local_wyoming
      conversation_engine: homeassistant
      language: en-US
      stt: wyoming
      tts: wyoming

rest_command:
  ollama_summary:
    url: "http://192.168.1.69:11434/v1/chat/completions"
    method: POST
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "model": "phi3:mini",
        "messages": [
          {"role": "user", "content": "{{ summary_text }}" }
        ]
      }
