        127.0.0.1: c4d21a250fc44fc4ac16c24298ffbb00
        ::1: c4d21a250fc44fc4ac16c24298ffbb00
        192.168.1.134: c4d21a250fc44fc4ac16c24298ffbb00
      allow_bypass_login: true
    - type: homeassistant

